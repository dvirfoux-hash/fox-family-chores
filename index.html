<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>בית משפחת פוקס</title>
<meta name="theme-color" content="#fff7ed">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="משפחת פוקס">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='22' fill='%23ea580c'/%3E%3Ctext x='50' y='68' font-size='58' text-anchor='middle'%3E🦊%3C/text%3E%3C/svg%3E">
<link rel="apple-touch-icon" href="icon.svg">
<style>
:root{--bg:#fff7ed;--ink:#1f2937;--muted:#6b7280;--card:#fff;--accent:#ea580c;--c:#ea580c;--r:28px;
--sat:env(safe-area-inset-top,0px);--sab:env(safe-area-inset-bottom,0px);--sal:env(safe-area-inset-left,0px);--sar:env(safe-area-inset-right,0px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{font-size:17px}
body{margin:0;font-family:"Segoe UI","Rubik","Heebo",Arial,sans-serif;color:var(--ink);min-height:100vh;min-height:100dvh;user-select:none;
 background:radial-gradient(circle at 15% 10%,#fde68a55 0,transparent 40%),radial-gradient(circle at 85% 90%,#f9a8d455 0,transparent 45%),linear-gradient(160deg,#fff7ed,#fdf2f8 55%,#eff6ff);background-attachment:fixed;
 padding:var(--sat) var(--sar) var(--sab) var(--sal);transition:background .4s}
body.kidmode{background:radial-gradient(circle at 10% 0%,color-mix(in srgb,var(--c) 22%,transparent) 0,transparent 50%),radial-gradient(circle at 100% 100%,#fde68a66 0,transparent 45%),linear-gradient(170deg,color-mix(in srgb,var(--c) 12%,#fff),#fffdf7);background-attachment:fixed}
body.parentmode{background:#f1f5f9}
button,input,select{font:inherit}
button{min-height:56px;border:0;border-radius:18px;padding:10px 20px;font-size:1.15rem;font-weight:800;cursor:pointer;background:#eef2f7;color:var(--ink);touch-action:manipulation}
button:active{transform:scale(.96)}
:focus-visible{outline:4px solid #2563eb;outline-offset:3px}
.primary{background:var(--accent);color:#fff}.danger{background:#b91c1c;color:#fff}.ok{background:#15803d;color:#fff}.ghost{background:transparent}
header{display:flex;align-items:center;gap:12px;padding:12px 20px;position:sticky;top:0;z-index:5;background:transparent}
header h1{margin:0;font-size:1.5rem;flex:1;color:#9a3412}
body.parentmode header{background:#334155}body.parentmode header h1{color:#fff}
header button{background:#fff;color:var(--ink);box-shadow:0 4px 14px rgba(0,0,0,.08);min-height:64px;font-size:1.3rem;border-radius:22px}
body.parentmode header button{background:rgba(255,255,255,.2);color:#fff;box-shadow:none;min-height:52px}
main{padding:12px 20px 28px;max-width:1150px;margin:auto}
/* HOME */
.who{text-align:center;font-size:clamp(2.2rem,6vw,2.8rem);margin:6px 0 4px;color:#7c2d12}
.whoSub{text-align:center;font-size:1.3rem;color:#9a3412;margin:0 0 10px}
.kids{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:24px;margin-top:16px}
.kid{background:linear-gradient(160deg,color-mix(in srgb,var(--c) 70%,#fff),var(--c));color:#fff;border-radius:36px;padding:26px 16px;font-size:clamp(2.4rem,5vw,3rem);font-weight:900;
 min-height:min(56vh,380px);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;box-shadow:0 14px 30px color-mix(in srgb,var(--c) 40%,transparent),inset 0 -8px 0 rgba(0,0,0,.12);text-shadow:0 2px 4px rgba(0,0,0,.25)}
.kid .av{font-size:clamp(5rem,14vw,8rem);line-height:1;background:rgba(255,255,255,.3);border-radius:50%;width:1.5em;height:1.5em;display:flex;align-items:center;justify-content:center;text-shadow:none}
.kid .av{font-size:clamp(4rem,10vw,6rem)}
.kid small{font-size:1.4rem;font-weight:800;background:rgba(255,255,255,.95);color:#92400e;border-radius:999px;padding:6px 18px;text-shadow:none}
@media (orientation:landscape){.kids{grid-template-columns:repeat(3,1fr)}}
.parentBtn{margin:36px auto 0;display:block;background:transparent;color:#a8a29e;font-size:.95rem;font-weight:600;min-height:44px}
/* KID */
.hello{display:flex;align-items:center;gap:18px;flex-wrap:wrap;background:#fffffff0;border-radius:32px;padding:18px 22px;box-shadow:0 10px 28px color-mix(in srgb,var(--c) 22%,transparent);border:4px solid color-mix(in srgb,var(--c) 35%,#fff)}
.hello .av{font-size:4.5rem;width:6.2rem;height:6.2rem;border-radius:50%;display:flex;align-items:center;justify-content:center;background:color-mix(in srgb,var(--c) 18%,#fff)}
.hello h2{margin:0;font-size:clamp(2.2rem,5.5vw,2.8rem);color:color-mix(in srgb,var(--c) 75%,#000);flex:1}
.starBadge{display:flex;align-items:center;gap:8px;background:linear-gradient(160deg,#fde68a,#fbbf24);color:#78350f;border-radius:999px;padding:10px 24px;font-size:2.2rem;font-weight:900;box-shadow:0 6px 0 #d97706}
.starBadge small{font-size:1.1rem;font-weight:800}
.mini{display:flex;gap:12px;flex-wrap:wrap;margin-top:14px}
.mini span{background:#fff;border-radius:999px;padding:8px 18px;font-size:1.25rem;font-weight:800;color:#374151;box-shadow:0 3px 10px rgba(0,0,0,.06)}
.secTitle{font-size:clamp(1.7rem,4vw,2.1rem);margin:26px 4px 6px;color:color-mix(in srgb,var(--c) 70%,#000)}
.chores{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:20px;margin-top:14px}
.chore{background:#fff;border-radius:32px;padding:20px;display:flex;flex-direction:column;align-items:center;gap:12px;box-shadow:0 8px 22px rgba(0,0,0,.07);text-align:center;border:4px solid transparent}
.chore .ic{font-size:4.2rem;line-height:1.1;width:6.5rem;height:6.5rem;display:flex;align-items:center;justify-content:center;border-radius:50%;background:color-mix(in srgb,var(--c) 12%,#fff)}
.chore .t{font-size:1.5rem;font-weight:800;line-height:1.3;flex:1;display:flex;align-items:center}
.pts{display:inline-block;background:linear-gradient(160deg,#fef3c7,#fde68a);color:#78350f;border-radius:999px;padding:6px 16px;font-weight:900;font-size:1.25rem}
.row .pts{font-size:1rem;padding:3px 10px}
.chore button.go{width:100%;min-height:76px;font-size:1.8rem;border-radius:24px;background:linear-gradient(160deg,#22c55e,#15803d);color:#fff;box-shadow:0 7px 0 #166534;text-shadow:0 1px 2px rgba(0,0,0,.3)}
.chore button.go:active{box-shadow:0 2px 0 #166534;transform:translateY(5px)}
.chore.done{background:linear-gradient(160deg,#ecfdf5,#d1fae5);border-color:#4ade80}
.chore.done .ic{background:#bbf7d0}
.doneTag,.pendTag{width:100%;min-height:76px;border-radius:24px;display:flex;align-items:center;justify-content:center;gap:10px;font-size:1.7rem;font-weight:900}
.doneTag{background:#16a34a;color:#fff}.doneTag b{font-size:2.3rem}
.chore.pend{background:#fffbeb;border-color:#fcd34d}.pendTag{background:#fde68a;color:#78350f}
.allDone{text-align:center;font-size:1.8rem;font-weight:900;color:#15803d;background:#dcfce7;border-radius:28px;padding:18px;margin-top:18px}
/* NETA (age<6) */
.little .chores{grid-template-columns:repeat(auto-fill,minmax(300px,1fr))}
@media (max-width:700px){.little .chores{grid-template-columns:1fr}}
.little .chore .ic{font-size:5.2rem;width:8rem;height:8rem}
.little .chore .t{font-size:1.75rem}
.little .chore button.go{min-height:90px;font-size:2.2rem}
.little .hello h2{font-size:clamp(2.5rem,6vw,3rem)}
/* PARENT */
.stats{display:flex;gap:16px;flex-wrap:wrap}
.stat{flex:1;min-width:150px;background:var(--card);border-radius:20px;padding:16px;text-align:center;border-top:6px solid var(--c);font-size:1.1rem}
.stat b{display:block;font-size:2.4rem;color:var(--c)}
h2{margin:26px 0 10px}
.panel{background:var(--card);border-radius:20px;padding:18px;margin-bottom:16px;box-shadow:0 2px 8px rgba(0,0,0,.05)}
.panel h3{font-size:1.35rem}
.row{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid #e5e7eb;flex-wrap:wrap;font-size:1.1rem}
.row:last-child{border:0}.row .grow{flex:1;min-width:140px}
input[type=text],input[type=number],input[type=password]{min-height:52px;border:2px solid #cbd5e1;border-radius:12px;padding:8px 12px;font-size:1.15rem;background:#fff;color:var(--ink)}
input[type=number]{width:90px}
label.chk{display:inline-flex;align-items:center;gap:8px;min-height:52px;padding:0 12px;border-radius:12px;background:#f1f5f9;font-weight:600}
label.chk input{width:26px;height:26px}
.tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}.tabs button{background:#fff}.tabs button.on{background:#334155;color:#fff}
.badge{border-radius:999px;padding:4px 12px;font-size:.95rem;font-weight:700}
.b-done{background:#dcfce7;color:#166534}.b-pending{background:#fef9c3;color:#854d0e}.b-rejected{background:#fee2e2;color:#991b1b}
.toast{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;pointer-events:none;z-index:50}
.toast div{background:#fff;border-radius:36px;padding:34px 56px;font-size:2.8rem;font-weight:900;box-shadow:0 20px 50px rgba(0,0,0,.25);animation:pop .35s cubic-bezier(.3,1.6,.6,1);text-align:center;color:#15803d;border:6px solid #86efac}
@keyframes pop{from{transform:scale(.4);opacity:0}}
canvas#cf{position:fixed;inset:0;pointer-events:none;z-index:49}
.modal{position:fixed;inset:0;background:rgba(15,23,42,.5);display:flex;align-items:center;justify-content:center;z-index:40}
.modal .box{background:#fff;border-radius:28px;padding:24px;width:min(420px,92vw);text-align:center}
.pinpad{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:14px;direction:ltr}
.pinpad button{min-height:68px;font-size:1.7rem}
.dots{font-size:2rem;letter-spacing:10px;min-height:44px;direction:ltr}
.muted{color:#475569}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}button:active{transform:none}}
</style>
</head>
<body>
<header><h1 id="title">🦊 בית משפחת פוקס</h1><span id="hdrBtns"></span></header>
<main id="app"></main>
<canvas id="cf"></canvas>
<script>
"use strict";
const P='foxFamilyChores_';
const load=(k,d)=>{try{const v=localStorage.getItem(P+k);return v?JSON.parse(v):d}catch(e){return d}};
const save=(k,v)=>localStorage.setItem(P+k,JSON.stringify(v));
const today=()=>{const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')};
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

const DEFAULT_KIDS=[
 {id:'neta',name:'נטע',age:4.5,color:'#9333ea',avatar:'🐣'},
 {id:'nave',name:'נוה',age:10,color:'#0d9488',avatar:'🦁'},
 {id:'maayan',name:'מעיין',age:8,color:'#ea580c',avatar:'🦋'}];
const Y=['neta'],B=['nave','maayan'],ALL=['neta','nave','maayan'];
const C=(name,points,icon,kids)=>({id:uid(),name,points,icon,allowedKids:kids});
const DEFAULT_CHORES=[
 // נטע (4.5) – פשוט ובטוח
 C('לפנות צלחת מהשולחן לשיש',6,'🍽️',Y),
 C('לסדר צעצועים בסל',8,'🧸',Y),
 C('לעזור לקפל מגבות קטנות עם מבוגר',10,'🧺',Y),
 C('לשים נעליים במקום',5,'👟',ALL),
 C('להשקות עציץ קטן עם עזרה',8,'🪴',Y),
 C('לסדר ספרים במדף הנמוך',8,'📚',Y),
 C('לשים בגדים מלוכלכים בסל הכביסה',6,'👕',ALL),
 C('לעזור להאכיל חיית מחמד (אם יש)',8,'🐾',Y),
 C('לסדר את המיטה בעזרת מבוגר',10,'🛏️',Y),
 // נוה ומעיין
 C('לפנות מהשולחן',8,'🍽️',B),
 C('לשטוף כוס/צלחת',5,'🥛',B),
 C('לסדר את החדר 5 דקות',10,'🧹',B),
 C('להאכיל חיית מחמד (אם יש)',8,'🐾',B),
 C('לסדר את המיטה',8,'🛏️',B),
 C('לקפל כביסה',20,'👚',B),
 C('להכניס כביסה למכונה',15,'🫧',B),
 C('לפנות מכונת כביסה',15,'🌀',B),
 C('לתלות כביסה',20,'🧷',B),
 C('להכניס מדיח',18,'🍴',B),
 C('להוציא מדיח',18,'✨',B),
 C('לשטוף קופסת אוכל',12,'🍱',B),
 C('לרוקן פח',15,'🗑️',B),
 C('להכין שולחן לארוחה',15,'🥄',B),
 C('לנגב את השולחן אחרי ארוחה',10,'🧽',B),
 C('לעזור לנטע במשימה',12,'🤝',B),
 C('לשאוב/לטאטא חדר',30,'🧹',B),
 C('לנקות חדר אמבטיה קטן',35,'🛁',['nave']),
 C('לעזור בקניות (פריקה)',25,'🛒',B),
 C('להכין כריך/חטיף בעצמי',20,'🥪',B),
 C('להחזיר כביסה מקופלת לארונות',15,'🗄️',B)];

let kids=load('kids',null)||DEFAULT_KIDS;
let chores=load('chores',null)||DEFAULT_CHORES;
let completions=load('completions',[]);
let settings=Object.assign({requireApproval:false,parentPin:'1234'},load('settings',{}));
const persist=()=>{save('kids',kids);save('chores',chores);save('completions',completions);save('settings',settings)};
persist();

const app=document.getElementById('app'),hdr=document.getElementById('hdrBtns');
let parentTab='today';
const kidById=id=>kids.find(k=>k.id===id);
const choreById=id=>chores.find(c=>c.id===id);
const pts=(kid,f)=>completions.filter(c=>c.kidId===kid&&c.status==='done'&&(!f||f(c))).reduce((s,c)=>s+c.points,0);

const reduceMotion=()=>window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches;
function setMode(m,color){document.body.className=m;document.documentElement.style.setProperty('--accent',color);document.documentElement.style.setProperty('--c',color);scrollTo(0,0)}
function home(){
 setMode('homemode','#ea580c');
 hdr.innerHTML='';
 app.innerHTML=`<h2 class="who">מי את/ה? 👋</h2><p class="whoSub">לוחצים על התמונה שלך</p><div class="kids">${kids.map(k=>`
  <button class="kid" style="--c:${k.color}" onclick="kidScreen('${k.id}')" aria-label="${esc(k.name)}"><span class="av">${k.avatar}</span>${esc(k.name)}<small>⭐ ${pts(k.id)}</small></button>`).join('')}</div>
  <button class="parentBtn" onclick="askPin()">להורים</button>`;
}

function kidScreen(id){
 const k=kidById(id);if(!k)return home();
 const little=k.age<6;
 setMode('kidmode',k.color);
 hdr.innerHTML=`<button onclick="home()" aria-label="חזרה לבית">🏠 ${little?'בית':'חזרה'}</button>`;
 const t=today();
 const mine=chores.filter(c=>c.allowedKids.includes(id)).sort((a,b)=>a.points-b.points);
 const st=cid=>{const c=completions.find(x=>x.kidId===id&&x.choreId===cid&&x.date===t&&x.status!=='rejected');return c&&c.status};
 const pend=completions.filter(c=>c.kidId===id&&c.date===t&&c.status==='pending').reduce((s,c)=>s+c.points,0);
 const doneCount=mine.filter(c=>st(c.id)).length;
 const card=c=>{const s=st(c.id);return `<div class="chore ${s==='done'?'done':s==='pending'?'pend':''}">
  <div class="ic" aria-hidden="true">${s==='done'?'✅':(c.icon||'⭐')}</div><div class="t">${esc(c.name)}</div><span class="pts">⭐ +${c.points}</span>
  ${s==='done'?`<div class="doneTag"><b>✔</b> ${little?'כל הכבוד!':'בוצע היום!'}</div>`:s==='pending'?`<div class="pendTag">⏳ ${little?'אבא/אמא יבדקו':'מחכה לאישור'}</div>`:`<button class="go" onclick="complete('${id}','${c.id}')">✔ בוצע!</button>`}</div>`};
 app.innerHTML=`<div class="${little?'little':''}">
 <div class="hello"><span class="av">${k.avatar}</span><h2>${little?'היי':'שלום'} ${esc(k.name)}!</h2><div class="starBadge" aria-label="${pts(id)} כוכבים">⭐ ${pts(id)}</div></div>
 ${little?'':`<div class="mini"><span>☀️ היום: ${pts(id,c=>c.date===t)}</span>${pend?`<span>⏳ מחכה: ${pend}</span>`:''}</div>`}
 <h3 class="secTitle">${little?'מה עושים? 🌟':'המשימות שלי ✨'}</h3>
 <div class="chores">${mine.map(card).join('')||'<p class="allDone">אין משימות כרגע 😊</p>'}</div>
 ${mine.length&&doneCount===mine.length?`<div class="allDone">🏆 עשית הכל! כל הכבוד!</div>`:''}</div>`;
}

function complete(kidId,choreId){
 const c=choreById(choreId),t=today();
 if(completions.some(x=>x.kidId===kidId&&x.choreId===choreId&&x.date===t&&x.status!=='rejected'))return;
 const status=settings.requireApproval?'pending':'done';
 completions.push({id:uid(),kidId,choreId,choreName:c.name,date:t,status,points:c.points,timestamp:Date.now()});
 persist();
 if(status==='done'){confetti(kidById(kidId).color);toast(`כל הכבוד! 🎉<br><span style="font-size:1.8rem">⭐ +${c.points}</span>`)}
 else toast('יופי! ⏳<br><span style="font-size:1.4rem">אבא/אמא יאשרו</span>');
 kidScreen(kidId);
}

function toast(html){document.querySelectorAll('.toast').forEach(x=>x.remove());const d=document.createElement('div');d.className='toast';d.innerHTML=`<div>${html}</div>`;document.body.appendChild(d);setTimeout(()=>d.remove(),1600)}
function confetti(color){
 if(reduceMotion())return;
 const cv=document.getElementById('cf'),x=cv.getContext('2d');cv.width=innerWidth;cv.height=innerHeight;
 const cols=[color,'#facc15','#22c55e','#3b82f6','#f472b6'];
 const ps=Array.from({length:120},()=>({x:innerWidth/2,y:innerHeight/2,vx:(Math.random()-.5)*16,vy:Math.random()*-16-4,s:6+Math.random()*6,c:cols[Math.random()*5|0],r:Math.random()*6}));
 let f=0;(function loop(){x.clearRect(0,0,cv.width,cv.height);ps.forEach(p=>{p.vy+=.5;p.x+=p.vx;p.y+=p.vy;p.r+=.2;x.save();x.translate(p.x,p.y);x.rotate(p.r);x.fillStyle=p.c;x.fillRect(-p.s/2,-p.s/2,p.s,p.s*.6);x.restore()});if(++f<90)requestAnimationFrame(loop);else x.clearRect(0,0,cv.width,cv.height)})();
}

let pinBuf='';
function askPin(){
 pinBuf='';const m=document.createElement('div');m.className='modal';m.id='pinM';
 m.innerHTML=`<div class="box"><h2 style="margin-top:0">כניסת הורים</h2><p class="muted" style="margin:0">הקלידו קוד</p><div class="dots" id="dots"></div>
 <div class="pinpad">${[1,2,3,4,5,6,7,8,9].map(n=>`<button onclick="pinKey('${n}')">${n}</button>`).join('')}<button onclick="pinKey('x')">⌫</button><button onclick="pinKey('0')">0</button><button class="primary" onclick="pinKey('ok')">OK</button></div>
 <button class="ghost" style="margin-top:10px" onclick="document.getElementById('pinM').remove()">ביטול</button></div>`;
 document.body.appendChild(m);
}
function pinKey(k){
 if(k==='x')pinBuf=pinBuf.slice(0,-1);else if(k==='ok'){if(pinBuf===settings.parentPin){document.getElementById('pinM').remove();parentTab='today';parent()}else{pinBuf='';toast('קוד שגוי')}}else if(pinBuf.length<8)pinBuf+=k;
 const d=document.getElementById('dots');if(d)d.textContent='●'.repeat(pinBuf.length);
}

function parent(){
 setMode('parentmode','#334155');
 hdr.innerHTML=`<button onclick="home()">🚪 יציאה</button>`;
 const tabs=[['today','📋 היום'],['chores','✏️ משימות'],['history','📅 היסטוריה'],['settings','⚙️ הגדרות']];
 app.innerHTML=`<div class="tabs">${tabs.map(([k,l])=>`<button class="${parentTab===k?'on':''}" onclick="parentTab='${k}';parent()">${l}</button>`).join('')}</div><div id="pc"></div>`;
 const pc=document.getElementById('pc'),t=today();
 if(parentTab==='today'){
  const pend=completions.filter(c=>c.status==='pending');
  pc.innerHTML=`<div class="stats" style="margin-bottom:16px">${kids.map(k=>`<div class="stat" style="--c:${k.color}">${k.avatar} ${esc(k.name)}<b>${pts(k.id)}</b><span class="muted">היום: ${pts(k.id,c=>c.date===t)}</span></div>`).join('')}</div>
  <div class="panel"><label class="chk"><input type="checkbox" ${settings.requireApproval?'checked':''} onchange="settings.requireApproval=this.checked;persist();parent()"> דורש אישור הורה</label>
  <span class="muted">${settings.requireApproval?'נקודות יינתנו רק אחרי אישור':'נקודות ניתנות מיד (אפשר לבטל כאן)'}</span></div>
  ${pend.length?`<div class="panel"><h3 style="margin-top:0">ממתינים לאישור (${pend.length})</h3>${pend.map(row).join('')}
   <div class="row"><button class="ok" onclick="approveAll()">✔ אשר הכל</button></div></div>`:''}
  <div class="panel"><h3 style="margin-top:0">בוצע היום</h3>${completions.filter(c=>c.date===t).sort((a,b)=>b.timestamp-a.timestamp).map(row).join('')||'<p class="muted">עדיין אין</p>'}
  <div class="row"><button class="danger" onclick="resetDay()">🔄 איפוס היום</button></div></div>`;
 } else if(parentTab==='history'){
  pc.innerHTML=historyHTML();
 } else if(parentTab==='chores'){
  pc.innerHTML=`<div class="panel"><p class="muted" style="margin-top:0">סמנו לאיזה ילד כל משימה מתאימה (נטע בת 4.5 – רק משימות פשוטות ובטוחות).</p>${chores.map(c=>`<div class="row">
   <input type="text" style="width:60px;text-align:center" value="${esc(c.icon||'')}" onchange="editC('${c.id}','icon',this.value)">
   <input type="text" class="grow" value="${esc(c.name)}" onchange="editC('${c.id}','name',this.value)">
   <input type="number" min="1" value="${c.points}" onchange="editC('${c.id}','points',+this.value||1)">
   ${kids.map(k=>`<label class="chk"><input type="checkbox" ${c.allowedKids.includes(k.id)?'checked':''} onchange="toggleKid('${c.id}','${k.id}',this.checked)">${esc(k.name)}</label>`).join('')}
   <button class="danger" onclick="delC('${c.id}')">🗑</button></div>`).join('')}
   <div class="row"><button class="primary" onclick="addC()">➕ הוסף משימה</button></div></div>`;
 } else {
  pc.innerHTML=`<div class="panel"><h3 style="margin-top:0">קוד הורה</h3><div class="row"><input type="password" inputmode="numeric" id="np" placeholder="קוד חדש (ספרות)"><button class="primary" onclick="setPin()">שמור</button></div></div>
  <div class="panel"><h3 style="margin-top:0">ילדים</h3>${kids.map(k=>`<div class="row"><input type="text" style="width:60px;text-align:center" value="${k.avatar}" onchange="editK('${k.id}','avatar',this.value)"><input type="text" class="grow" value="${esc(k.name)}" onchange="editK('${k.id}','name',this.value)">גיל <input type="number" step="0.5" value="${k.age}" onchange="editK('${k.id}','age',+this.value)"><input type="color" value="${k.color}" style="width:52px;height:48px" onchange="editK('${k.id}','color',this.value)"></div>`).join('')}</div>
  <div class="panel"><h3 style="margin-top:0">גיבוי והעברה בין טאבלטים</h3><div class="row"><button class="primary" onclick="exportJ()">⬇ ייצוא גיבוי</button>
   <label class="chk" style="background:#e5e7eb;font-weight:700;padding:0 16px">⬆ ייבוא גיבוי<input type="file" accept=".json,application/json" style="display:none" onchange="importJ(this.files[0])"></label></div></div>
  <div class="panel"><h3 style="margin-top:0">איפוס</h3><div class="row"><button class="danger" onclick="if(confirm('לאפס את כל הנקודות של כולם?')){completions=[];persist();parent()}">אפס את כל הנקודות</button>
  <button class="danger" onclick="if(confirm('להחזיר את רשימת המשימות לברירת מחדל?')){chores=DEFAULT_CHORES;persist();parent()}">משימות ברירת מחדל</button></div></div>`;
 }
}
function hDate(s){const[y,m,d]=s.split('-').map(Number);const dt=new Date(y,m-1,d);const days=['ראשון','שני','שלישי','רביעי','חמישי','שישי','שבת'];return `יום ${days[dt.getDay()]} ${d}.${m}.${y}`}
function dAgo(n){const d=new Date();d.setDate(d.getDate()-n);return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
function historyHTML(){
 if(!completions.length)return '<div class="panel"><p class="muted">אין היסטוריה</p></div>';
 const wk=dAgo(6),done=completions.filter(c=>c.status==='done');
 let h=`<div class="panel"><h3 style="margin-top:0">📊 סיכום כללי</h3>`+kids.map(k=>`<div class="row"><span class="grow">${k.avatar} <b>${esc(k.name)}</b></span><span>סה״כ: <span class="pts">${pts(k.id)}</span></span><span style="margin-inline-start:12px">השבוע: <span class="pts">${pts(k.id,c=>c.date>=wk)}</span></span></div>`).join('')+
 `<div class="row"><span class="grow"><b>משימות שבוצעו (סה״כ)</b></span><b>${done.length}</b></div><div class="row"><span class="grow"><b>נקודות השבוע (7 ימים)</b></span><span class="pts">${done.filter(c=>c.date>=wk).reduce((s,c)=>s+c.points,0)}</span></div></div>`;
 const dates=[...new Set(completions.map(c=>c.date))].sort().reverse().slice(0,60);
 dates.forEach(dt=>{const day=completions.filter(c=>c.date===dt).sort((a,b)=>a.timestamp-b.timestamp);
  const tot=day.filter(c=>c.status==='done').reduce((s,c)=>s+c.points,0);
  h+=`<div class="panel"><h3 style="margin-top:0">📅 ${hDate(dt)}${dt===today()?' (היום)':''}</h3>`;
  kids.forEach(k=>{const kc=day.filter(c=>c.kidId===k.id);if(!kc.length)return;h+=`<div style="margin:8px 0 4px;font-weight:bold">${k.avatar} ${esc(k.name)} – <span class="pts">${kc.filter(c=>c.status==='done').reduce((s,c)=>s+c.points,0)}</span> נק׳</div>`+kc.map(row).join('')});
  const other=day.filter(c=>!kidById(c.kidId));if(other.length)h+=other.map(row).join('');
  h+=`<div class="row" style="border-top:2px solid #eee;margin-top:6px"><span class="grow"><b>סה״כ ליום</b> (${day.filter(c=>c.status==='done').length} משימות)</span><span class="pts">${tot}</span></div></div>`});
 return h}
function row(c){const k=kidById(c.kidId)||{name:'?',avatar:''};const lbl={done:'אושר',pending:'ממתין',rejected:'נדחה'}[c.status];
 return `<div class="row"><span class="grow">${k.avatar} <b>${esc(k.name)}</b> – ${esc(c.choreName||(choreById(c.choreId)||{}).name||'')} <span class="pts">${c.points}</span></span><span class="badge b-${c.status}">${lbl}</span>
 ${c.status!=='done'?`<button class="ok" onclick="setSt('${c.id}','done')">✔ אשר</button>`:''}${c.status!=='rejected'?`<button class="danger" onclick="setSt('${c.id}','rejected')">✖ דחה</button>`:''}</div>`}
function setSt(id,s){const c=completions.find(x=>x.id===id);if(c){c.status=s;persist();parent()}}
function approveAll(){completions.forEach(c=>{if(c.status==='pending')c.status='done'});persist();parent()}
function resetDay(){if(confirm('למחוק את כל המשימות של היום? (הנקודות של היום יבוטלו)')){const t=today();completions=completions.filter(c=>c.date!==t);persist();parent()}}
function editC(id,f,v){const c=choreById(id);c[f]=v;persist()}
function toggleKid(id,kid,on){const c=choreById(id);c.allowedKids=on?[...new Set([...c.allowedKids,kid])]:c.allowedKids.filter(x=>x!==kid);persist()}
function delC(id){if(confirm('למחוק משימה?')){chores=chores.filter(c=>c.id!==id);persist();parent()}}
function addC(){chores.push({id:uid(),name:'משימה חדשה',points:10,icon:'⭐',allowedKids:['nave','maayan']});persist();parent();scrollTo(0,document.body.scrollHeight)}
function editK(id,f,v){kidById(id)[f]=v;persist()}
function setPin(){const v=document.getElementById('np').value.trim();if(!/^\d{4,8}$/.test(v))return alert('קוד של 4–8 ספרות');settings.parentPin=v;persist();toast('הקוד נשמר ✔')}
function exportJ(){const b=new Blob([JSON.stringify({app:'foxFamilyChores',version:1,exported:new Date().toISOString(),kids,chores,completions,settings},null,2)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='fox-chores-backup-'+today()+'.json';a.click()}
function importJ(f){if(!f)return;const r=new FileReader();r.onload=()=>{try{const d=JSON.parse(r.result);if(!Array.isArray(d.chores)||!Array.isArray(d.completions))throw 0;if(!confirm('הייבוא יחליף את כל הנתונים בטאבלט הזה. להמשיך?'))return;kids=d.kids||kids;chores=d.chores;completions=d.completions;settings=Object.assign(settings,d.settings||{});persist();toast('יובא בהצלחה ✔');parent()}catch(e){alert('קובץ לא תקין')}};r.readAsText(f)}

if('serviceWorker' in navigator&&location.protocol.startsWith('http'))navigator.serviceWorker.register('sw.js').catch(()=>{});
home();
</script>
</body>
</html>
